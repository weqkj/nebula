name: Nebula
options:
  bundleIdPrefix: com.nebula
  deploymentTarget:
    iOS: "16.0"

targets:
  Nebula:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebula.xray
        INFOPLIST_KEY_CFBundleDisplayName: Nebula
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Выбор собственных обоев"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
    dependencies:
      - target: NebulaTunnel

  NebulaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    info:
      path: Tunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebula.xray.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 5.9
