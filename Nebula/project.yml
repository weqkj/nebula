name: Nebula
options:
  bundleIdPrefix: com.nebula.xray
  deploymentTarget:
    iOS: "16.0"

targets:
  Nebula:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebula.xray.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nebula
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        SWIFT_VERSION: 5.9
    dependencies:
      - target: NebulaTunnel
        embed: true

  NebulaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebula.xray.tunnel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NebulaTunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
        SWIFT_VERSION: 5.9
