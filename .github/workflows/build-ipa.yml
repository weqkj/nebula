name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Nebula
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Nebula.xcodeproj -scheme Nebula -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nebula.app Payload/
          zip -qr Nebula.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-ipa
          path: Nebula/Nebula.ipa
